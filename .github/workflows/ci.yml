name: Validate TravellingBingo

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Playwright 的 webServer 会先构建一次生产包，再用同一份产物启动预览。
      - name: Build once and run browser E2E
        run: npm run test:e2e

      - name: Assemble and verify production site
        run: npm run site:assemble && npm run site:verify
