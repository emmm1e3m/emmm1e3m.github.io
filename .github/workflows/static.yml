name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source and generated assets
        run: npm run verify

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Playwright 的 webServer 会先构建一次生产包，再用同一份产物启动预览。
      # E2E 通过后继续组装该产物，避免为 Pages 重复构建。
      - name: Build once and run browser E2E
        run: npm run test:e2e

      # 只组装允许公开的根首页和游戏产物，研究资料与原图不会进入 Pages。
      - name: Assemble public site
        run: npm run site:assemble

      - name: Verify public site boundary
        run: npm run site:verify

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
