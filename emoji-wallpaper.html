<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="data:," />
    <meta name="theme-color" content="#f6f6f6" />
    <title>Emoji 壁纸</title>
    <style>
      :root {
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'Microsoft YaHei',
          sans-serif;
        color: #363636;
        background: #f5f5f5;
        font-synthesis: none;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      a,
      input,
      select {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid #a3a3a3;
        outline-offset: 3px;
      }
      button {
        color: inherit;
      }
      header {
        max-width: 1320px;
        margin: auto;
        padding: 26px 36px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #e3e3e3;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .brand {
        display: flex;
        gap: 12px;
        align-items: center;
        font-weight: 700;
        letter-spacing: -0.4px;
      }
      .brand-icon {
        background: #e4e4e4;
        border-radius: 12px;
        padding: 9px;
        font-size: 22px;
      }
      .back {
        font-size: 13px;
        color: #717171;
      }
      main {
        max-width: 1250px;
        margin: auto;
        padding: 38px 30px 30px;
      }
      .intro {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 28px;
      }
      .eyebrow {
        color: #818181;
        font-size: 11px;
        letter-spacing: 2px;
        font-weight: 700;
      }
      h1 {
        font-size: 32px;
        letter-spacing: -1.3px;
        margin: 9px 0;
      }
      p {
        color: #7e7e7e;
        font-size: 13px;
        line-height: 1.8;
        margin: 0;
      }
      .local {
        border: 1px solid #dcdcdc;
        border-radius: 30px;
        padding: 7px 12px;
        color: #767676;
        font-size: 11px;
      }
      .workspace {
        display: grid;
        grid-template-columns: 370px 1fr;
        gap: 28px;
      }
      .panel {
        min-width: 0;
        background: white;
        border: 1px solid #e5e5e5;
        border-radius: 22px;
        padding: 24px;
      }
      .section + .section {
        border-top: 1px solid #ededed;
        margin-top: 22px;
        padding-top: 22px;
      }
      .heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
      }
      h2 {
        font-size: 14px;
        margin: 0;
        font-weight: 650;
      }
      .number {
        font-size: 10px;
        color: #989898;
        margin-right: 8px;
      }
      .hint {
        font-size: 11px;
        color: #929292;
      }
      .slots {
        display: flex;
        gap: 10px;
        margin-bottom: 13px;
      }
      .slot {
        position: relative;
        border: 1px solid #e4e4e4;
        background: #f6f6f6;
        width: 65px;
        height: 61px;
        border-radius: 14px;
        font-size: 30px;
      }
      .slot.active {
        border: 2px solid #818181;
        background: #efefef;
      }
      .slot small {
        position: absolute;
        right: 5px;
        bottom: 2px;
        font-size: 9px;
        color: #7e7e7e;
      }
      .remove {
        border: 0;
        background: transparent;
        font-size: 11px;
        color: #818181;
        margin-left: auto;
      }
      .emoji-font {
        font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
      }
      .ratio-options {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 7px;
      }
      .ratio-options button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 50px;
        border: 1px solid #e3e3e3;
        border-radius: 9px;
        background: white;
        font-size: 12px;
      }
      .ratio-symbol {
        display: inline-block;
        flex-shrink: 0;
        border: 1.5px solid #8a8a8a;
        border-radius: 3px;
      }
      .ratio-options button[aria-pressed='true'] {
        background: #eee;
        border-color: #777;
        color: #222;
      }
      .ratio-options button[aria-pressed='true'] .ratio-symbol {
        border-color: #333;
      }
      .emoji-grid {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 5px;
        margin: 12px 0;
      }
      .emoji-grid.expanded {
        max-height: 360px;
        overflow-y: auto;
        align-content: start;
        overscroll-behavior: contain;
      }
      .emoji-toggle {
        width: 100%;
        border: 0;
        border-radius: 8px;
        padding: 9px;
        margin: 0 0 12px;
        background: #f5f5f5;
        color: #666;
        font-size: 12px;
      }
      .emoji-grid button {
        min-width: 0;
        padding: 2px;
        border: 0;
        background: transparent;
        border-radius: 9px;
        font-size: 23px;
        min-height: 36px;
      }
      .emoji-grid button:hover {
        background: #ededed;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .text-input,
      select {
        min-width: 0;
        width: 100%;
        border: 1px solid #e1e1e1;
        border-radius: 10px;
        padding: 10px;
        background: #fff;
        color: #525252;
        font-size: 12px;
      }
      .small-btn {
        flex-shrink: 0;
        border: 1px solid #e1e1e1;
        background: #f6f6f6;
        border-radius: 10px;
        padding: 10px 13px;
        font-size: 12px;
      }
      label.label {
        display: block;
        font-size: 12px;
        margin: 13px 0 7px;
      }
      .font-note {
        font-size: 10px;
        margin-top: 7px;
        line-height: 1.6;
      }
      .segmented {
        display: flex;
        gap: 6px;
      }
      .segmented button {
        flex: 1;
        border: 1px solid #e3e3e3;
        border-radius: 10px;
        background: #fff;
        padding: 10px 4px;
        font-size: 12px;
      }
      .segmented button[aria-pressed='true'] {
        background: #eaeaea;
        border-color: #9b9b9b;
        color: #4c4c4c;
      }
      .range-row {
        display: grid;
        grid-template-columns: 48px 1fr 32px;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        margin-top: 15px;
      }
      .range-row output {
        text-align: right;
        font-size: 11px;
        color: #818181;
      }
      input[type='range'] {
        width: 100%;
        accent-color: #838383;
      }
      input[type='checkbox'] {
        accent-color: #838383;
      }
      .swatches {
        display: flex;
        gap: 9px;
        margin-top: 12px;
        flex-wrap: wrap;
      }
      .swatch {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid white;
        box-shadow: 0 0 0 1px #dfdfdf;
      }
      .swatch[aria-pressed='true'] {
        box-shadow: 0 0 0 2px #858585;
      }
      .color-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 14px;
        font-size: 12px;
      }
      .color-row input[type='color'] {
        width: 32px;
        height: 30px;
        padding: 0;
        border: 0;
        background: transparent;
      }
      .color-row code {
        font-size: 11px;
        color: #7f7f7f;
      }
      .auto {
        margin-left: auto;
        display: flex;
        gap: 5px;
        align-items: center;
        font-size: 11px;
      }
      .preview-panel {
        display: flex;
        flex-direction: column;
        min-width: 0;
        background: #ececec;
        border: 1px solid #e2e2e2;
        border-radius: 22px;
        padding: 21px 25px;
      }
      .preview-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        color: #8b8b8b;
      }
      .live {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .live:before {
        content: '';
        width: 6px;
        height: 6px;
        background: #8a8a8a;
        border-radius: 50%;
      }
      .stage {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 570px;
        flex: 1;
        padding: 24px 0;
      }
      .canvas-wrap {
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 18px 45px #4646461c;
        border: 5px solid #fff9;
        line-height: 0;
        max-width: 100%;
      }
      canvas {
        display: block;
        max-width: 100%;
        width: auto;
        height: auto;
      }
      .preview-bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        border-top: 1px solid #dbdbdb;
        padding-top: 18px;
      }
      .shuffle {
        background: #f8f8f8;
        border: 1px solid #dadada;
        border-radius: 10px;
        font-size: 12px;
        padding: 10px 13px;
      }
      .preview-bottom p {
        font-size: 11px;
      }
      .export {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-top: 20px;
      }
      .download {
        flex: 1;
        border: 0;
        background: #555555;
        color: white;
        font-weight: 600;
        border-radius: 12px;
        padding: 15px 20px;
        font-size: 14px;
      }
      .download:hover {
        background: #444444;
      }
      .export-note {
        font-size: 11px;
        color: #949494;
        text-align: center;
        margin-top: 9px;
      }
      footer {
        text-align: center;
        font-size: 11px;
        color: #9f9f9f;
        margin: 25px 0 6px;
      }
      #status {
        font-size: 12px;
        color: #626262;
        min-height: 20px;
        margin-top: 8px;
      }
      #save-link {
        font-size: 12px;
        text-decoration: underline;
        display: none;
      }
      @media (min-width: 900px) {
        .preview-column {
          position: sticky;
          top: 20px;
          align-self: start;
        }
      }
      @media (max-width: 800px) {
        header {
          padding: 18px 20px;
        }
        main {
          padding: 26px 16px;
        }
        .intro {
          margin-bottom: 20px;
        }
        .local {
          display: none;
        }
        h1 {
          font-size: 27px;
        }
        .workspace {
          grid-template-columns: 1fr;
          gap: 18px;
        }
        .preview-column {
          grid-row: 1;
        }
        .stage {
          min-height: 360px;
          padding: 18px 0;
        }
        .panel {
          padding: 20px;
        }
        .preview-panel {
          padding: 16px;
        }
        .canvas-wrap {
          border-radius: 18px;
        }
        .preview-bottom p {
          max-width: 170px;
        }
        .export {
          margin-top: 12px;
        }
      }
      /* 追加于现有样式之后：黑白灰控件与紧凑分组布局。 */
      header {
        padding: 22px 30px;
      }
      header h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.35;
        letter-spacing: -0.6px;
      }
      main {
        padding-top: 24px;
      }
      .intro {
        display: none;
      }
      .brand-icon {
        display: none;
      }
      .workspace {
        grid-template-columns: 390px minmax(0, 1fr);
        gap: 24px;
      }
      .panel {
        padding: 22px;
      }
      .heading {
        gap: 8px;
      }
      .slots {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
      }
      .slot {
        flex: 1 1 0;
        min-width: 0;
        width: auto;
        height: 76px;
        font-size: 37px;
        border-radius: 12px;
        background: #fafafa;
      }
      .slot.active {
        border: 2px solid #454545;
        background: #f1f1f1;
      }
      .slot small {
        right: 8px;
        bottom: 5px;
      }
      #shuffle,
      #remove {
        display: inline-flex;
        flex: 0 0 36px;
        align-items: center;
        justify-content: center;
        min-width: 36px;
        min-height: 36px;
        padding: 6px;
        margin: 0;
        border: 1px solid #e3e3e3;
        border-radius: 9px;
        background: #fff;
        color: #666;
        font-size: 16px;
      }
      #shuffle:hover,
      #remove:hover {
        color: #222;
        background: #eee;
      }
      #shuffle svg,
      #remove svg {
        width: 18px;
        height: 18px;
      }
      .category-nav {
        display: flex;
        gap: 4px;
        overflow-x: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
        padding: 2px 0 7px;
      }
      .category-nav button {
        flex: 0 0 auto;
        min-width: 36px;
        min-height: 36px;
        border: 0;
        border-radius: 8px;
        padding: 6px 9px;
        background: transparent;
        color: #747474;
        font-size: 12px;
        white-space: nowrap;
      }
      .category-nav button:hover,
      .category-nav button[aria-pressed='true'],
      .category-nav button.active {
        background: #ededed;
        color: #262626;
      }
      #emoji-grid.emoji-grid {
        display: block;
        max-height: 280px;
        margin: 4px 0 10px;
        overflow-y: auto;
        overflow-x: hidden;
        overscroll-behavior: contain;
        scrollbar-width: thin;
        scrollbar-color: #c8c8c8 transparent;
        scroll-behavior: smooth;
      }
      #emoji-grid.emoji-grid.expanded {
        max-height: 440px;
      }
      .emoji-group {
        margin: 0 0 15px;
        scroll-margin-top: 6px;
      }
      .emoji-group h3 {
        margin: 0;
        padding: 8px 2px;
        font-size: 11px;
        line-height: 1.5;
        color: #858585;
        font-weight: 500;
      }
      .group-grid {
        display: grid;
        grid-template-columns: repeat(8, minmax(36px, 1fr));
        gap: 2px 0;
      }
      .group-grid button {
        min-width: 36px;
        min-height: 38px;
        padding: 2px;
      }
      .group-grid button[aria-pressed='true'] {
        background: #eaeaea;
        box-shadow: inset 0 0 0 1px #bdbdbd;
      }
      .emoji-toggle {
        min-height: 36px;
      }
      .color-modes {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 5px;
      }
      .color-modes button[data-color-mode] {
        min-width: 0;
        min-height: 38px;
        border: 1px solid #e2e2e2;
        border-radius: 8px;
        background: #fff;
        color: #777;
        padding: 7px 2px;
        font-size: 12px;
      }
      .color-modes button[aria-pressed='true'],
      .color-modes button.active {
        border-color: #555;
        background: #ededed;
        color: #222;
      }
      .color-editor {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 12px;
      }
      .color-editor[hidden] {
        display: none;
      }
      .color-editor #color {
        flex: 0 0 42px;
        width: 42px;
        height: 38px;
        min-height: 36px;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 3px;
        background: white;
        cursor: pointer;
      }
      .color-editor #hex-input {
        min-width: 0;
        width: 100%;
        height: 38px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background: white;
        padding: 8px 10px;
        color: #555;
        font-family: ui-monospace, monospace;
        font-size: 12px;
      }
      #color-mode-note {
        color: #858585;
        font-size: 11px;
        line-height: 1.6;
        margin-top: 9px;
      }
      .quality-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 44px;
        margin-top: 13px;
        font-size: 12px;
      }
      .quality-row label {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 36px;
        cursor: pointer;
      }
      input#quality[role='switch'] {
        appearance: none;
        -webkit-appearance: none;
        position: relative;
        flex: 0 0 46px;
        width: 46px;
        height: 36px;
        margin: 0;
        border: 0;
        border-radius: 18px;
        background: linear-gradient(#d8d8d8, #d8d8d8) center / 46px 26px no-repeat;
        cursor: pointer;
      }
      input#quality[role='switch']::before {
        content: '';
        position: absolute;
        width: 20px;
        height: 20px;
        top: 8px;
        left: 3px;
        border-radius: 50%;
        background: white;
        box-shadow: 0 1px 3px #0002;
        transition: transform 0.15s ease;
      }
      input#quality[role='switch']:checked {
        background-image: linear-gradient(#4c4c4c, #4c4c4c);
      }
      input#quality[role='switch']:checked::before {
        transform: translateX(20px);
      }
      .ratio-options {
        gap: 6px;
      }
      .ratio-options button {
        min-width: 0;
        min-height: 46px;
        gap: 7px;
      }
      .range-row {
        grid-template-columns: 40px minmax(0, 1fr) 38px;
      }
      input#zoom {
        min-width: 0;
        min-height: 36px;
        margin: 0;
        accent-color: #686868;
      }
      @media (max-width: 899px) {
        .workspace {
          grid-template-columns: minmax(0, 1fr);
        }
        header {
          padding: 18px 20px;
        }
        main {
          padding: 18px 18px 24px;
        }
        .panel {
          padding: 18px;
        }
      }
      @media (max-width: 380px) {
        header {
          padding: 16px 12px;
        }
        header h1 {
          font-size: 20px;
        }
        main {
          padding: 12px 8px 20px;
        }
        .panel {
          padding: 12px 7px;
          border-radius: 16px;
        }
        .workspace {
          gap: 14px;
        }
        .slots {
          gap: 6px;
        }
        .slot {
          height: 68px;
        }
        #emoji-grid.emoji-grid {
          scrollbar-width: none;
        }
        #emoji-grid.emoji-grid::-webkit-scrollbar {
          width: 0;
        }
        .preview-panel {
          padding: 16px 12px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #emoji-grid.emoji-grid {
          scroll-behavior: auto;
        }
        input#quality[role='switch']::before {
          transition: none;
        }
      }
      .slot small {
        font-family: system-ui, sans-serif;
        font-size: 10px;
        letter-spacing: 0;
      }
      .quality-row > span {
        flex: 1;
      }
      .quality-row strong {
        display: block;
        font-weight: 600;
      }
      .quality-row small {
        display: block;
        margin-top: 4px;
        color: #888;
        font-size: 11px;
      }
      #color-editor-label {
        flex-shrink: 0;
        font-size: 11px;
        color: #888;
      }
      button:disabled {
        cursor: default;
        opacity: 0.38;
      }
      input:disabled {
        cursor: default;
      }
      input#color:disabled {
        opacity: 1;
      }
      .emoji-group[hidden] {
        display: none !important;
      }
      .category-nav {
        flex-wrap: wrap;
        overflow: visible;
        gap: 3px;
      }
      .category-nav button {
        font-size: 11px;
        padding: 6px 8px;
      }
      #color-dialog {
        width: min(360px, calc(100vw - 32px));
        border: 1px solid #ddd;
        border-radius: 18px;
        padding: 22px;
        color: #333;
        background: #fff;
        box-shadow: 0 20px 80px #0003;
      }
      #color-dialog::backdrop {
        background: #0004;
        backdrop-filter: blur(3px);
      }
      .dialog-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .dialog-heading h2 {
        font-size: 16px;
      }
      #color-close {
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 8px;
        background: #f5f5f5;
        font-size: 22px;
        color: #777;
      }
      .dialog-done {
        width: 100%;
        margin-top: 18px;
        min-height: 42px;
        border: 0;
        border-radius: 10px;
        background: #333;
        color: #fff;
        font-size: 13px;
      }
      #color-dialog .color-editor {
        margin-top: 20px;
      }
      #color-dialog #color {
        width: 62px;
        height: 52px;
        flex-basis: 62px;
      }
      .quality-row {
        width: 100%;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 48px;
        align-items: center;
        gap: 12px;
        min-height: 48px;
        cursor: pointer;
      }
      input#quality[role='switch'] {
        justify-self: end;
        display: block;
        width: 48px;
        height: 28px;
        min-height: 28px;
        border: 0;
        border-radius: 999px;
        background: #d5d5d5;
        box-shadow: inset 0 0 0 1px #00000006;
      }
      input#quality[role='switch']::before {
        width: 22px;
        height: 22px;

      async function loadApple() {
        if (!applePromise)
          applePromise = (async () => {
            const url = new URL('emoji-assets/apple-emoji.ttf?v=26.2.1', location.href).href
            let cache = null
            try {
              if ('caches' in window) cache = await caches.open('emoji-wallpaper-font-v1')
            } catch {}
            let cached = null
            try {
              cached = await cache?.match(url)
            } catch {}
            const install = async (response) => {
              const face = new FontFace('Wallpaper Apple Emoji', await response.arrayBuffer())
              await face.load()
              document.fonts.add(face)
            }
            if (cached) {
              try {
                await install(cached)
                return
              } catch {
                try {
                  await cache.delete(url)
                } catch {}
              }
            }
            const response = await fetch(url, { cache: 'force-cache' })
            if (!response.ok) throw new Error('字体下载失败')
            const copy = response.clone()
            await install(response)
            try {

            } catch {}

        const sample = document.createElement('canvas')

        sample.height = 64
        const c = sample.getContext('2d', { willReadFrequently: true })
        c.font = '46px ' + font()
        c.textAlign = 'center'
        c.textBaseline = 'middle'
        paintEmoji(c, emoji, 32, 32, 46)
        const data = c.getImageData(0, 0, 64, 64).data
        let r = 0,
          g = 0,
          b = 0,
          total = 0
        for (let i = 0; i < data.length; i += 4) {
          const max = Math.max(data[i], data[i + 1], data[i + 2]),
            min = Math.min(data[i], data[i + 1], data[i + 2])
          const weight = ((data[i + 3] / 255) * (max - min)) / 255
          if (max < 70) continue
          r += data[i] * weight
          g += data[i + 1] * weight
          b += data[i + 2] * weight
          total += weight
        }
        if (!total) {
          return '#f5f5f5'
        }
        const rgb = [r, g, b].map((v) => v / total / 255)
        const hi = Math.max(...rgb),
          lo = Math.min(...rgb),
          delta = hi - lo
        if (delta < 0.01) {
          return '#f5f5f5'
        }
        let hue =
          hi === rgb[0]
            ? ((rgb[1] - rgb[2]) / delta) % 6
            : hi === rgb[1]
              ? (rgb[2] - rgb[0]) / delta + 2
              : (rgb[0] - rgb[1]) / delta + 4
        hue = (hue + 6) % 6
        const sourceSaturation = delta / (1 - Math.abs(hi + lo - 1))
        const saturation = Math.min(0.86, Math.max(0.32, sourceSaturation * 1.2))
        const lightness = sourceSaturation < 0.3 ? 0.955 : 0.9
        const chroma = (1 - Math.abs(2 * lightness - 1)) * saturation
        const secondary = chroma * (1 - Math.abs((hue % 2) - 1))
        const offset = lightness - chroma / 2
        const channels = [
          [chroma, secondary, 0],
          [secondary, chroma, 0],
          [0, chroma, secondary],
          [0, secondary, chroma],
          [secondary, 0, chroma],
          [chroma, 0, secondary],
        ][Math.floor(hue)]
        return (
          '#' +
          channels
            .map((v) =>
              Math.round((v + offset) * 255)
                .toString(16)
                .padStart(2, '0'),
            )
            .join('')
        )

        const first = emojiBackground(state.emojis[0])
        const second = hasSecond ? emojiBackground(state.emojis[1]) : first

        else if (state.colorMode === 'emoji2') state.bg = second
        else

            [1, 3, 5]

                Math.round(

                )
                  .toString(16)
                  .padStart(2, '0'),

      function draw(canvas, width, height) {

              y + unit * 0.09,

      }
      $('color-close').onclick = () => $('color-dialog').close()
      $('color-done').onclick = () => {
        if (applyHex()) $('color-dialog').close()
      }
      $('color-dialog').addEventListener('close', () => {
        $('hex-input').setCustomValidity('')
        colorControls()
      })
      $('color-dialog').addEventListener('click', (event) => {
        if (event.target !== $('color-dialog')) return
        const box = $('color-dialog').getBoundingClientRect()
        if (
          event.clientX < box.left ||
          event.clientX > box.right ||
          event.clientY < box.top ||
          event.clientY > box.bottom
        )
          $('color-dialog').close()
      })
      $('font').onchange = refreshFont
      document.querySelectorAll('[data-ratio]').forEach(
        (button) =>
          (button.onclick = () => {
            state.ratio = button.dataset.ratio.split(',').map(Number)
            document
              .querySelectorAll('[data-ratio]')
              .forEach((b) => b.setAttribute('aria-pressed', String(b === button)))
            render()
          }),
      )
      $('quality').onchange = () => {
        state.resolution = $('quality').checked ? '4k' : '2k'
        render()
      }
      $('shuffle').onclick = () => {
        if (state.emojis.length < 2) return
        state.emojis.reverse()
        slots()
        autoColor()
        render()
        message('已交换 Emoji 1 和 Emoji 2')
      }
      $('download').onclick = async () => {
        const button = $('download')
        button.disabled = true
        button.textContent = '正在生成…'
        try {
          await document.fonts.ready
          if ($('font').value === 'apple') await loadApple()
          const [w, h] = dimensions()
          const canvas = document.createElement('canvas')
          draw(canvas, w, h)
          const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'))
          if (!blob) throw new Error('PNG 生成失败')
          if (saveUrl) URL.revokeObjectURL(saveUrl)
          saveUrl = URL.createObjectURL(blob)
          const a = document.createElement('a')
          a.href = saveUrl
          a.download = `emoji-wallpaper-${w}x${h}.png`
          a.click()
          $('save-link').href = saveUrl
          $('save-link').style.display = 'inline'
          message(`已生成 ${w} × ${h} PNG；若未自动下载，可打开图片保存。`)
        } catch (error) {
          message('生成失败，请重试或选择较小尺寸。')
        } finally {
          button.disabled = false
          button.textContent = '↓ 下载壁纸 PNG'
        }
      }
      let resizeFrame = 0
      new ResizeObserver(() => {
        cancelAnimationFrame(resizeFrame)
        resizeFrame = requestAnimationFrame(render)
      }).observe($('stage'))
      slots()
      document.querySelectorAll('.emoji-font').forEach((el) => (el.style.fontFamily = font()))
      document.fonts.ready.then(refreshFont)
    </script>
  </body>
</html>
